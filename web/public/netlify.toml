# Netlify config for WDS Final Functional Site - Static
[build]
  command = "echo 'No build - fully functional static site with auth, no backend needed'"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Redirects - CRITICAL for SPA to fix 404 on williamsds.netlify.app
# Without this, direct access to /login.html works, but /login or /auth/login would 404
# This ensures all routes serve index.html fallback, then JS router handles

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Main SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
